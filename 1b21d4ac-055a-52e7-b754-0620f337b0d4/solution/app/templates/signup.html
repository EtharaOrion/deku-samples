{% extends "base.html" %}
{% block route %}
<div class="route-scroll auth">
  <h1 class="auth-title display">Sign up</h1>
  {% if reason %}<div class="notice" role="alert">{{ reason }}</div>{% endif %}
  <form class="form" method="post" action="/signup">
    <div class="form-field">
      <label class="form-label" for="email">Email</label>
      <input class="form-input" id="email" name="email" type="email" required
             value="{{ email or '' }}" autocomplete="email" autocapitalize="off" spellcheck="false">
    </div>
    <div class="form-field">
      <label class="form-label" for="password">Password</label>
      <input class="form-input" id="password" name="password" type="password" required
             minlength="8" autocomplete="new-password">
    </div>
    <div class="form-actions">
      <button class="btn" type="submit">Create account</button>
    </div>
  </form>
  <p class="auth-alt">Producing already? <a href="/studio/login">Sign in to the studio</a>.</p>
</div>
{% endblock %}
