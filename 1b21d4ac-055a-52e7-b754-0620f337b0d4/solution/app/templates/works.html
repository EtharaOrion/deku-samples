{% extends "base.html" %}
{% import "_macros.html" as m %}
{% block route %}
<div class="route-scroll">
  <section class="work-open route-pad">
    <h1 class="work-open-line display is-soft">{{ opening_line }}</h1>
  </section>

  {% if works %}
  <div class="work-list route-pad" role="list" data-state="filled">
    {% for work in works %}
    <div role="listitem">{{ m.entry(work) }}</div>
    {% endfor %}
  </div>
  {% else %}
  <p class="work-list route-pad record-empty" data-state="empty">No work is published yet.</p>
  {% endif %}
</div>
{% endblock %}
