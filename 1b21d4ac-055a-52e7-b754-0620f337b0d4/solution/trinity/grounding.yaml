    weight: 0.04
    evaluation_target: state_change
    criterion: A deliberately moved slug leaves the old address answering permanently.
    judgment: The old address still resolves and a redirect row exists.
    evidence: The old address status and the redirect row.
    mode: compiled
    compiled_test: test_changed_slug_leaves_a_permanent_redirect
  - id: T21
    dimension: functionality
