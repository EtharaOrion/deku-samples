    judgment: The listed works and the credit rows agree in number.
    evidence: The talent payload and the credit rows.
    mode: compiled
    compiled_test: test_talent_selected_work_is_derived_from_credits

judged_criteria:
  - id: J1
    criterion: A refused publish shows its reason beside the poster in question, naming the missing written alternative.
    is_positive: true
    type: instruction following
    dimension: instruction_following
    evaluation_target: user_facing_message
    importance: critically_important
    score: 5
    evaluation_rule: >
      Yes if the message sits next to the poster in the studio editor and says the
      written alternative is missing. No if the message appears only as a page-level
      banner, or if the missing field is unnamed.
  - id: J2
    criterion: The refusal a signed-up account meets at the studio reads as a deliberate decision rather than as something going wrong.
    is_positive: true
    type: instruction following
    dimension: instruction_following
    evaluation_target: user_facing_message
    importance: critically_important
    score: 5
    evaluation_rule: >
      Yes if that reader is returned to a working public surface that says in the
      house's own voice that the studio is not theirs. No if the refusal reads as an
      error, a dead end, or a half-drawn studio the reader is left standing in.
  - id: J3
    criterion: On the studio palette each record shows its own state in words beside its title.
    is_positive: true
    type: task completion
    dimension: instruction_following
    evaluation_target: user_facing_message
    importance: somewhat_important
    score: 1
    evaluation_rule: >
      Yes if each row states whether the record is live or held back, in words. No if the
      state is carried by a colour, an icon or a position alone.
  - id: J4
    criterion: The page that follows a publish reads as an ending rather than as another form.
    is_positive: true
    type: task completion
    dimension: ux_flow
    evaluation_target: trajectory
    importance: critically_important
    score: 5
    evaluation_rule: >
      Yes if the confirmation is composed in the house's own register and offers one
      onward move. No if it is a bare success screen, or if it puts the publish control
      back in front of a producer who has just used it.
  - id: J5
    criterion: The studio's first screen presents the palette as the way work is done rather than as one control among a page of chrome.
    is_positive: true
    type: task completion
    dimension: ux_flow
    evaluation_target: trajectory
    importance: critically_important
    score: 5
    evaluation_rule: >
      Yes if a producer arriving at the studio can see that typing is the next thing to
      do. No if the palette shares the screen with a toolbar, a sidebar or a dashboard
      that competes with it for the first move.
  - id: J6
    criterion: The studio's create route belongs to the same house as the public site rather than reading as an admin form bolted on behind that site.
    is_positive: true
    type: task completion
    dimension: ux_flow
    evaluation_target: trajectory
    importance: important
    score: 3
    evaluation_rule: >
      Yes if the create route carries the site's own frame, type and restraint. No if it
      is set in a default form style, or if its chrome is unrelated to the chrome a
      visitor sees.
  - id: J7
    criterion: A drained still on the public work index reads as a deliberate treatment rather than as a picture still arriving.
    is_positive: true
    type: task completion
    dimension: functionality
    evaluation_target: user_facing_message
    importance: important
    score: 3
    evaluation_rule: >
      Yes if the resting index reads as a composed page of colourless photographs. No if
      a drained still is indistinguishable from a placeholder, a broken image or a
      loading state.
  - id: J8
    criterion: On the entry cluster, the work index and the roster alike the two grounds read as a matched warm pair rather than as black on white.
    is_positive: true
    type: instruction following
    dimension: ui_visual
    evaluation_target: user_facing_message
    importance: important
    score: 3
    evaluation_rule: >
      Yes if the dark surface reads as warmed toward red and the pale one as warmed
      toward green, and the site never reads as neutral grey. No if the pair reads as
      pure black and pure white, or as two unrelated temperatures.
  - id: J9
    criterion: The roster reads as one composed screen in which the name, the label, the mark and the portrait belong to a single figure.
    is_positive: true
    type: task completion
    dimension: ui_visual
    evaluation_target: user_facing_message
    importance: important
    score: 3
    evaluation_rule: >
      Yes if the four elements sit as one arrangement under the name. No if they read as
      four stacked blocks, or if the name has to share the screen's weight with anything
      around it.
  - id: J10
    criterion: A link on a public route is recognisable as a link by a reader whose pointer stays parked.
    is_positive: true
    type: instruction following
    dimension: motion
    evaluation_target: user_facing_message
    importance: important
    score: 3
    evaluation_rule: >
      Yes if position, setting and grouping make what is pressable legible at rest. No if
      finding what is pressable requires sweeping the pointer, or if a colour is what
      marks it.
  - id: J11
    criterion: The about route's blur reads as attached to the reader's hand rather than as an effect played at them.
    is_positive: true
    type: task completion
    dimension: functionality
    evaluation_target: user_facing_message
    importance: critically_important
    score: 5
    evaluation_rule: >
      Yes if the sharpening tracks the wheel continuously and stops where the reader
      stops. No if it advances in steps, runs ahead of the scroll, or leaves text
      unreadable once the reader has stopped moving.
  - id: J12
    criterion: Under a reduced-motion preference the about route still reads as the designed page rather than as a stripped fallback.
    is_positive: true
    type: instruction following
    dimension: accessibility
    evaluation_target: user_facing_message
    importance: critically_important
    score: 5
    evaluation_rule: >
      Yes if that reader loses the effect and nothing else, with the same blocks in the
      same places. No if the route drops content, shifts its layout, or reads as a plain
      unstyled version of itself.
  - id: J13
    criterion: The focus ring is legible on the pale ground, on the dark ground and over a photograph alike.
    is_positive: true
    type: task completion
    dimension: accessibility
    evaluation_target: user_facing_message
    importance: important
    score: 3
    evaluation_rule: >
      Yes if a keyboard reader can find the focused control on all three surfaces. No if
      the ring disappears against one of them, or if it reads as a browser default
      dropped onto a considered page.
  - id: J14
    criterion: The narrow roster reads as the same roster a wide window shows rather than as a different page.
    is_positive: true
    type: task completion
    dimension: responsiveness
    evaluation_target: user_facing_message
    importance: important
    score: 3
    evaluation_rule: >
      Yes if the name setting, the order and the sense of one talent at a time all
      survive the change. No if the narrow layout reads as a list, a grid or a stack that
      the wide layout never suggested.
  - id: J15
    criterion: A visitor on a phone is shown the work as a colour portfolio, with nothing held behind a gesture that device cannot perform.
    is_positive: true
    type: task completion
    dimension: responsiveness
    evaluation_target: user_facing_message
    importance: somewhat_important
    score: 1
    evaluation_rule: >
      Yes if everything a pointer would reveal is already present on the narrow layout.
      No if a caption, a colour or a title is reachable only by a hover on a surface that
      has no pointer.
  - id: J16
    criterion: The fade between two public routes reads as unhurried rather than as the site being slow.
    is_positive: true
    type: task completion
    dimension: motion
    evaluation_target: user_facing_message
    importance: somewhat_important
    score: 1
    evaluation_rule: >
      Yes if the change reads as one object turning a page. No if the reader is left
      waiting on a dimmed screen, or if the fade is indistinguishable from a slow
      response.
  - id: J17
    criterion: A commissioner can tell from any public route how to reach the house, and finds one address rather than a form.
    is_positive: true
    type: instruction following
    dimension: instruction_following
    evaluation_target: user_facing_message
    importance: critically_important
    score: 5
    evaluation_rule: >
      Yes if the enquiry channel is findable from the chrome on every route and resolves
      to the house's own address. No if it is buried on one route only, or if the site
      asks the reader to fill in fields instead.
  - id: J18
    criterion: An emptied roster speaks in the house's own register rather than as a system message.
    is_positive: true
    type: task completion
    dimension: functionality
    evaluation_target: user_facing_message
    importance: somewhat_important
    score: 1
    evaluation_rule: >
      Yes if the sentence reads as written by the house and does not read as a failure.
      No if it reads as an error string, a placeholder, or a developer's stub.
  - id: J19
    criterion: A work index caught mid-load looks like the work index rather than like a page being assembled.
    is_positive: true
    type: task completion
    dimension: functionality
    evaluation_target: user_facing_message
    importance: important
    score: 3
    evaluation_rule: >
      Yes if the reserved spaces read as part of the composition, carrying no spinner, no
      shimmer and no dimensions drawn across them. No if the loading page shows skeleton
      furniture the finished page never has.
