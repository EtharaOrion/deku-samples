- id: visitor_browses_and_opens_an_event
  purpose: A stranger reaches a published event page from the landing wall and reads its panel
  substeps:
    - kind: browser
      do: Open the landing route and confirm the category grid lists twelve categories
      cov: C-UF-01, C-FE-08, C-FE-11, C-FE-12, C-FE-10, C-DC-05
    - kind: browser
      do: Open the running category page and confirm Thursday Night 5K is listed
      cov: C-UF-03, C-OV-02
    - kind: browser
      do: Open the event page for thursday-night-5k and confirm the registration panel is present
      cov: C-OV-01, C-FE-13, C-CN-02
    - kind: browser
      do: Open the books category page and confirm the masthead names the category over a count of published events
      cov: C-FE-27
    - kind: browser
      do: Confirm the event page shows the start time labelled with the zone the event is held in
      cov: C-TR-22
    - kind: browser
      do: Open the address riverside-winter-time-trial while signed out and confirm the panel reads Registration Is Closed
      cov: C-FE-46
    - kind: pytest
      test: test_community.py::test_seeded_events_are_stored_at_their_boundaries
      critical: true
    - kind: pytest
      test: test_community.py::test_seeded_closed_event_is_stored_closed

- id: app_is_reachable_and_credentials_work
  purpose: The deployed app answers on its published origin and the documented credentials sign in
  substeps:
    - kind: browser
      do: Open the sign-in route and confirm the form asks for an email and a password only
      cov: C-CN-03, C-UF-12
    - kind: browser
      do: Confirm the sign-in card carries the brand lockup, the two fields, one primary action, one text link to the other route
      cov: C-FE-28
    - kind: pytest
      test: test_community.py::test_health_endpoint_answers_on_the_app_origin
      critical: true
    - kind: pytest
      test: test_community.py::test_handle_change_is_refused_on_a_taken_name
      critical: true
    - kind: pytest
      test: test_community.py::test_seeded_password_signs_every_account_in
      critical: true

- id: guest_registers_and_receives_a_ticket
  purpose: A signed-in guest takes a free seat and is issued a ticket code
  substeps:
    - kind: browser
      do: Sign in with the guest credentials documented in the app user readme
      cov: C-UF-05, C-DC-04, C-UF-15
    - kind: browser
      do: Open the event page for riverside-track-session and register
      cov: C-OV-03, C-OV-02, C-FE-22
    - kind: browser
      do: Confirm the panel now shows the registered state with a ticket code
    - kind: browser
      do: Confirm the signed-in shell keeps a persistent left rail beside the content listing Home, Discover, Settings
      cov: C-FE-29, C-FE-30
    - kind: browser
      do: Open the registrations route and confirm the guest own registrations are listed under an Upcoming heading
      cov: C-FE-31
    - kind: pytest
      test: test_community.py::test_registration_confirms_and_issues_ticket
      critical: true
    - kind: pytest
      test: test_community.py::test_confirmed_count_reconciles_with_stored_rows
      critical: true

- id: concurrent_last_seat_leaves_one_confirmed
  purpose: Two guests taking the last seat at the same instant produce one seat and one waiting-list place
  substeps:
    - kind: pytest
      test: test_community.py::test_last_seat_race_confirms_exactly_one_row
      critical: true
    - kind: pytest
      test: test_community.py::test_waitlist_positions_stay_contiguous
      critical: true
    - kind: pytest
      test: test_community.py::test_ticket_code_row_is_unique
    - kind: pytest
      test: test_community.py::test_registration_row_stores_status_and_position
    - kind: pytest
      test: test_community.py::test_repeat_registration_stores_one_row
      critical: true

- id: host_works_the_approval_queue
  purpose: A host approves a pending request and declines another from the queue
  substeps:
    - kind: browser
      do: Sign in as the seeded host and open the guest list for sunrise-long-run
      cov: C-UF-11, C-RL-02, C-UF-10, C-CN-04, C-CN-05
    - kind: browser
      do: Confirm the queue shows one request in the pending state as a word rather than a colour alone
      cov: C-UX-11
    - kind: browser
      do: Confirm the guest list toolbar offers an Export CSV control beside the status filter, above a table whose header row names the guest, the email, the status, the waiting-list position, the ticket code
      cov: C-FE-34, C-FE-35
    - kind: browser
      do: Confirm the door field carries an action reading Check In
      cov: C-FE-36
    - kind: browser
      do: Open the registration settings screen for riverside-winter-time-trial and confirm a switch reads Registration Open above a capacity stepper carrying a caption
      cov: C-FE-37, C-FE-38
    - kind: pytest
      test: test_community.py::test_approval_queue_confirms_pending_registration
      critical: true
    - kind: pytest
      test: test_community.py::test_declined_registration_holds_no_seat
    - kind: pytest
      test: test_community.py::test_guest_list_export_carries_the_pinned_header
      critical: true

- id: freed_seat_promotes_the_waiting_list
  purpose: Cancelling a confirmed registration passes the seat to the head of the waiting list at once
  substeps:
    - kind: pytest
      test: test_community.py::test_cancel_promotes_head_of_waiting_list
      critical: true
    - kind: pytest
      test: test_community.py::test_promotion_mail_follows_a_freed_seat
      critical: true
    - kind: pytest
      test: test_community.py::test_capacity_raise_promotes_the_waiting_list
      critical: true
    - kind: pytest
      test: test_community.py::test_capacity_raise_mail_reaches_the_promoted_guest
      critical: true

- id: host_checks_a_guest_in_at_the_door
  purpose: A host checks a ticket in once and a repeat scan records no second arrival
  substeps:
    - kind: browser
      do: Sign in as the seeded guest, open the registrations page and follow the link to the ticket
      cov: C-UF-13, C-UF-14
    - kind: browser
      do: Confirm the ticket page shows a scan code drawn as vector geometry rather than an image file
      cov: C-FE-17, C-FE-18
    - kind: browser
      do: Confirm the ticket card offers an Add to Calendar control beside the link back to the event
      cov: C-FE-39
    - kind: pytest
      test: test_community.py::test_check_in_records_one_arrival
      critical: true
    - kind: pytest
      test: test_community.py::test_closed_event_keeps_held_registrations_and_the_door
      critical: true

- id: host_publishes_a_new_event
  purpose: A host creates an event from the composer and it appears on its category page
  substeps:
    - kind: browser
      do: Sign in as the seeded host and open the composer route
      cov: C-UF-08, C-FE-23, C-UF-07, C-UX-08
    - kind: browser
      do: Fill the composer with a title, a category, a city, a start, an end and a capacity, then submit
      cov: C-UX-01, C-UX-02, C-CN-06
    - kind: browser
      do: Confirm the new event page renders in its own key colour rather than a plain grey ground
      cov: C-UX-07
    - kind: browser
      do: Open the manage overview screen for the new event and confirm four counters sit above overline labels
      cov: C-FE-33
    - kind: browser
      do: Open the calendars route and confirm the New Calendar action opens a dialog asking for a name, a slug, a category, a city, a public setting
      cov: C-FE-32
    - kind: browser
      do: Fill that dialog with the slug riverside-run-club, submit, and confirm the refusal beneath the field reads That address is already taken.
      cov: C-FE-48
    - kind: pytest
      test: test_community.py::test_seeded_accounts_and_calendars_are_stored
      critical: true
    - kind: pytest
      test: test_community.py::test_host_creates_a_calendar_in_the_namespace
      critical: true

- id: cancelled_event_cannot_be_republished
  purpose: Calling an event off needs a typed reason and cannot be undone
  substeps:
    - kind: browser
      do: Open the event page for autumn-book-swap and confirm a cancellation notice replaces the panel
      cov: C-UX-10, C-FE-13
    - kind: pytest
      test: test_community.py::test_event_cancel_requires_reason_and_is_one_way
      critical: true
    - kind: pytest
      test: test_community.py::test_seeded_cancelled_event_stores_its_reason

- id: guest_is_denied_every_host_surface
  purpose: A guest session is refused the guest list and the approval endpoint at the API
  substeps:
    - kind: pytest
      test: test_community.py::test_guest_is_denied_the_guest_list
      critical: true
    - kind: pytest
      test: test_community.py::test_guest_is_denied_the_approval_endpoint
      critical: true
    - kind: pytest
      test: test_community.py::test_guest_is_denied_the_guest_list_export
      critical: true
    - kind: browser
      do: Sign in as the seeded guest, open the profile settings route, type the handle priya-raman, submit, and confirm the address preview beneath the field is joined by a refusal reading That handle is already taken.
      cov: C-FE-40, C-FE-47

- id: foreign_host_and_anonymous_caller_are_denied
  purpose: A second host and an unauthenticated caller are both refused and neither row moves
  substeps:
    - kind: pytest
      test: test_community.py::test_other_host_cannot_cancel_a_foreign_event
      critical: true
    - kind: pytest
      test: test_community.py::test_anonymous_registration_is_denied
      critical: true
    - kind: pytest
      test: test_community.py::test_guest_is_denied_calendar_creation
      critical: true
    - kind: pytest
      test: test_community.py::test_ticket_address_answers_anyone_presenting_the_code
      critical: true

- id: draft_event_cannot_be_read_by_a_stranger
  purpose: A draft event answers with the same page a slug that never existed answers
  substeps:
    - kind: browser
      do: Open the address for harbour-loop-recovery-jog while signed out and confirm the not-found page appears
      cov: C-FE-14, C-FE-15, C-FE-16
    - kind: pytest
      test: test_community.py::test_draft_event_is_hidden_from_a_guest
      critical: true

- id: full_event_refuses_a_further_registration
  purpose: A registration on a full event with no waiting list is refused and the seat count holds
  substeps:
    - kind: pytest
      test: test_community.py::test_full_event_without_a_waiting_list_is_refused
      critical: true
    - kind: pytest
      test: test_community.py::test_event_with_a_bad_end_time_is_refused
    - kind: pytest
      test: test_community.py::test_capacity_below_confirmed_count_is_refused
    - kind: pytest
      test: test_community.py::test_reserved_slug_is_refused
    - kind: pytest
      test: test_community.py::test_rate_limit_refuses_a_login_burst
    - kind: pytest
      test: test_community.py::test_closed_registration_refuses_a_new_registration
      critical: true

- id: empty_guest_list_names_the_absence
  purpose: A host opening an event with no registrations reads an empty state rather than a blank panel
  substeps:
    - kind: browser
      do: Sign in as the second seeded host and open the guest list for winter-reading-night
      cov: C-UF-09, C-UX-09, C-UF-06
    - kind: browser
      do: Confirm the empty state names the absence and offers one action
      cov: C-UF-16, C-FE-20, C-UF-18
    - kind: pytest
      test: test_community.py::test_empty_guest_list_returns_an_empty_array
      critical: true

- id: discovery_filters_are_shareable_addresses
  purpose: A filtered discovery address reproduces the same list for a second visitor
  substeps:
    - kind: browser
      do: Open the discovery route filtered to the books category in Lisbon and read the result list
      cov: C-UF-02, C-UX-13, C-CN-07
    - kind: browser
      do: Reload the same address and confirm the same list is shown
      cov: C-UF-17, C-CN-08, C-CN-01
    - kind: browser
      do: Type a word from an event title into the discovery search field and confirm the address gains that term in its query string
      cov: C-FE-24
    - kind: browser
      do: Clear the discovery filters, then confirm the page control names how many events are shown out of the total and that the closed event carries the closed word in a pill with no seat caption
      cov: C-FE-25, C-FE-26
    - kind: pytest
      test: test_community.py::test_discovery_filters_by_category_and_city
      critical: true
    - kind: pytest
      test: test_community.py::test_page_size_limit_is_enforced
    - kind: pytest
      test: test_community.py::test_root_slug_resolution_names_its_source
    - kind: pytest
      test: test_community.py::test_search_term_narrows_the_event_list
      critical: true
    - kind: pytest
      test: test_community.py::test_event_list_reports_a_total_count_header
    - kind: pytest
      test: test_community.py::test_event_payload_carries_its_time_zone

- id: registration_mail_reaches_the_right_inbox
  purpose: Each registration outcome sends its own pinned subject to the one guest concerned
  substeps:
    - kind: pytest
      test: test_community.py::test_confirmation_email_reaches_the_registrant
      critical: true
    - kind: pytest
      test: test_community.py::test_waiting_list_mail_names_the_waiting_list
      critical: true
    - kind: pytest
      test: test_community.py::test_event_cancellation_mail_carries_the_host_reason
      critical: true
    - kind: pytest
      test: test_community.py::test_guest_cancellation_sends_no_confirmation_mail
    - kind: pytest
      test: test_community.py::test_email_log_row_follows_a_real_send
    - kind: pytest
      test: test_community.py::test_capacity_raise_with_nobody_waiting_sends_no_mail
