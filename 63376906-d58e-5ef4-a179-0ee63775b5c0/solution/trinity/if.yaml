schema_version: 1
task_name: deku/mass-balance-attestation
archetype: mass-balance-attestation

constraints:

  - id: IF-1
    category: format
    evaluator: pytest
    statement: "Every mass a route returns is an integer number of grams and every proportion is an integer number of basis points, on every route without exception."
    target: "test_mass.py::test_every_collection_route_answers_in_the_pinned_shape"
    src: "A mass field is an integer number of grams and a proportion field is an integer number of basis points, on every route without exception."

  - id: IF-2
    category: format
    evaluator: pytest
    statement: "Every mail leaves addressed to one recipient, with no second address on it."
    target: "test_mass.py::test_certificate_issue_sends_mail_to_the_recipient"
    src: "Every mail leaves through `mailpit` over SMTP at `SMTP_HOST` and `SMTP_PORT`, addressed to exactly one recipient with no copies."

  - id: IF-3
    category: output_shape
    evaluator: pytest
    statement: "A collection answers as a bare JSON array and a single object answers as a bare JSON object."
    target: "test_mass.py::test_every_collection_route_answers_in_the_pinned_shape"
    src: "Every collection route returns a top-level JSON array. Every single-object route returns one JSON object."

  - id: IF-4
    category: output_shape
    evaluator: pytest
    statement: "A carbon value is returned only alongside the three components it depends on."
    target: "test_mass.py::test_carbon_figure_never_returns_without_its_four_components"
    src: "No route returns a carbon value without its boundary, method version and uncertainty, or one energy figure without the other."

  - id: IF-5
    category: scope
    evaluator: pytest
    statement: "The build stops at the product boundary and grows no controller, laboratory scheduler, model, invoice or purchase order."
    target: "test_mass.py::test_out_of_scope_routes_do_not_exist"
    src: "It schedules no laboratory sample, holds no calibration curve and runs no analyst worklist."

  - id: IF-6
    category: scope
    evaluator: pytest
    statement: "The eight issuing conditions stay eight, and no route adds a ninth or waives one."
    target: "test_mass.py::test_certificate_preview_returns_eight_conditions"
    src: "None of the eight is waivable and the same eight are re-checked on the server at the moment of signing."

  - id: IF-7
    category: tool_use
    evaluator: pytest
    statement: "Every write carries the idempotency header the brief names, and the key is read as a promise about one body."
    target: "test_mass.py::test_repeated_idempotency_key_with_a_changed_body_is_refused"
    src: "The same key with a **different** body answers `409` naming `idempotency_key_reuse`, and"

  - id: IF-8
    category: tool_use
    evaluator: pytest
    statement: "Mail leaves over the SMTP service the brief names rather than through a log line."
    target: "test_mass.py::test_records_accounts_and_mail_live_in_the_real_services"
    src: "Every record lives in `postgres`. Every account lives in `keycloak`. Every mail leaves through `mailpit`."

  - id: IF-9
    category: ordering
    evaluator: pytest
    statement: "The conditions are settled at the moment of signing rather than carried over from the preview."
    target: "test_mass.py::test_conditions_are_redecided_between_preview_and_signing"
    src: "The eight conditions are decided again at the moment of signing, against the records as they stand then rather than as they stood at the preview."

  - id: IF-10
    category: ordering
    evaluator: pytest
    statement: "A late record is routed by its effective date rather than by the order it arrived in."
    target: "test_mass.py::test_closed_period_refuses_reopening_and_opens_a_restatement"
    src: "A consumption whose effective date falls in a closed period is refused as a write into that period and opens a restatement instead."

  - id: IF-11
    category: negative
    evaluator: pytest
    statement: "No route anywhere accepts a percentage, a carbon value or a loss figure from a caller."
    target: "test_mass.py::test_no_route_accepts_a_typed_percentage"
    src: "No route accepts a recycled-content percentage, a carbon value or a loss figure from a caller."

  - id: IF-12
    category: negative
    evaluator: pytest
    statement: "No yield figure escapes to a certificate, a document or a stranger."
    target: "test_mass.py::test_yield_is_denied_to_a_collector_and_absent_from_a_certificate"
    src: "A yield figure appears on no certificate, in no certificate document and in no verification answer."

not_applicable: {}
