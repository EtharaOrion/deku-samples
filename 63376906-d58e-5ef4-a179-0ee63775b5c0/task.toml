service_profile = "P6-db-auth-email"
variant_axes    = []
capability_flags = "aesthetic"
task_code       = "E_suppl_inve_mass-balance-attestation_20260904_085738"
naming_scheme   = "task-code-v1"
design_direction = "editorial-serif"
grader_version  = "0.22.0"

language     = "typescript"
archetype    = "mass-balance-attestation"
