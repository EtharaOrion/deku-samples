schema_version = "1.4"

[task]
name = "deku/mass-balance-attestation"
version = "1.0.0"
description = "A production and attestation system for a chemical recycling plant: feedstock batches whose claimability resolves against the collector approval in force on the day they arrived, process runs whose consumption rows carry the mass that makes a batch-to-lot genealogy a graph in both directions, a mass balance ledger that refuses an over-allocation rather than warning about it, a carbon figure that never renders without its boundary, its method version and its uncertainty, and a certificate that is a document, an object at a permanent address and a permission that can be withdrawn"
authors = [
  { name = "suryansh", email = "suryansh@ethara.ai" },
  { name = "sarvex", email = "sarvex@ethara.ai" },
  { name = "madhur.parwal", email = "madhur.parwal@ethara.ai" },
  { name = "utsav.jain", email = "utsav.jain@ethara.ai" },
  { name = "abhishek.shaw", email = "abhishek.shaw@ethara.ai" },
  { name = "kaustubh.dalvi", email = "kaustubh.dalvi@ethara.ai" },
  { name = "raja.kumarint17", email = "raja.kumarint17@ethara.ai" },
]
uuid_v5 = ""
keywords = ["greenfield", "enterprise", "typescript", "postgres", "keycloak", "mailpit", "inventory-allocation"]

