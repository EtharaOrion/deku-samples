  <text x="830.0" y="819" text-anchor="middle" font-family="'JetBrains Mono','SF Mono','Berkeley Mono',ui-monospace,'Courier New',monospace" font-size="17" fill="#4d5878">727/952 · 670/952</text>
  <line x1="1066.7" y1="180" x2="1066.7" y2="745" stroke="rgba(43,51,82,0.11)" stroke-width="1" stroke-dasharray="4 8"/>
  <rect x="1200.3" y="593.0" width="96.0" height="152.0" rx="6" fill="#3f63a8"/>
  <text x="1248.3" y="577.0" text-anchor="middle" font-family="'JetBrains Mono','SF Mono','Berkeley Mono',ui-monospace,'Courier New',monospace" font-size="21" font-weight="bold" fill="#3f63a8">28%</text>
  <rect x="1310.3" y="636.3" width="96.0" height="108.7" rx="6" fill="#a3008f"/>
