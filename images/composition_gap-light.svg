  <text x="110" y="876" font-family="'JetBrains Mono','SF Mono','Berkeley Mono',ui-monospace,'Courier New',monospace" font-size="16" fill="#4d5878">the workflow column is the RL signal; the drop from left to right is competence that did not compose</text>
