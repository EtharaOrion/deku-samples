<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Substep accuracy versus workflow accuracy. a workflow passes only when every one of its substeps passes">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8f9fc"/>
      <stop offset="55%" stop-color="#eceff7"/>
      <stop offset="100%" stop-color="#f8f9fc"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>

  <text x="110" y="68" font-family="'DM Sans','Inter','Segoe UI',Roboto,ui-sans-serif,system-ui,sans-serif" font-size="40" font-weight="bold" fill="#0b0f1a" letter-spacing="-0.5">Substep accuracy versus workflow accuracy</text>
  <text x="110" y="104" font-family="'JetBrains Mono','SF Mono','Berkeley Mono',ui-monospace,'Courier New',monospace" font-size="19" fill="#4d5878">a workflow passes only when every one of its substeps passes</text>
