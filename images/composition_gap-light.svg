<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Substep accuracy against workflow accuracy. a workflow passes only when every one of its substeps passes">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf8f4"/>
      <stop offset="60%" stop-color="#f3efe6"/>
      <stop offset="100%" stop-color="#faf8f4"/>
    </linearGradient>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#b9781f"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="rgba(255,255,255,0.55)" stroke-width="3"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>

  <text x="110" y="72" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', ui-serif, serif" font-size="40" font-weight="bold" fill="#0a1414">Substep accuracy against workflow accuracy</text>
  <text x="110" y="108" font-family="'JetBrains Mono','SF Mono','Berkeley Mono',ui-monospace,'Courier New',monospace" font-size="19" fill="#4a6560">a workflow passes only when every one of its substeps passes</text>
  <line x1="1180" y1="47" x2="1226" y2="47" stroke="#0e8a78" stroke-width="4"/>
  <circle cx="1203" cy="47" r="8" fill="#0e8a78" stroke="#ffffff" stroke-width="3"/>
  <text x="1238" y="54" font-family="'JetBrains Mono','SF Mono','Berkeley Mono',ui-monospace,'Courier New',monospace" font-size="20" fill="#0a1414">opus-5</text>
  <line x1="1338" y1="47" x2="1384" y2="47" stroke="#b9781f" stroke-width="3.5" stroke-dasharray="9 7"/>
  <polygon points="1361,38 1370,47 1361,56 1352,47" fill="url(#hatch)" stroke="#ffffff" stroke-width="2.5"/>
  <text x="1396" y="54" font-family="'JetBrains Mono','SF Mono','Berkeley Mono',ui-monospace,'Courier New',monospace" font-size="20" fill="#0a1414">glm-5.3</text>
  <line x1="110.0" y1="770.0" x2="1540.0" y2="770.0" stroke="rgba(10,30,28,0.10)" stroke-width="1"/>
  <text x="94.0" y="777.0" text-anchor="end" font-family="'JetBrains Mono','SF Mono','Berkeley Mono',ui-monospace,'Courier New',monospace" font-size="18" fill="#4a6560">0%</text>
  <line x1="110.0" y1="615.0" x2="1540.0" y2="615.0" stroke="rgba(10,30,28,0.10)" stroke-width="1"/>
  <text x="94.0" y="622.0" text-anchor="end" font-family="'JetBrains Mono','SF Mono','Berkeley Mono',ui-monospace,'Courier New',monospace" font-size="18" fill="#4a6560">20%</text>
  <line x1="110.0" y1="460.0" x2="1540.0" y2="460.0" stroke="rgba(10,30,28,0.10)" stroke-width="1"/>
  <text x="94.0" y="467.0" text-anchor="end" font-family="'JetBrains Mono','SF Mono','Berkeley Mono',ui-monospace,'Courier New',monospace" font-size="18" fill="#4a6560">40%</text>
  <line x1="110.0" y1="305.0" x2="1540.0" y2="305.0" stroke="rgba(10,30,28,0.10)" stroke-width="1"/>
  <text x="94.0" y="312.0" text-anchor="end" font-family="'JetBrains Mono','SF Mono','Berkeley Mono',ui-monospace,'Courier New',monospace" font-size="18" fill="#4a6560">60%</text>
  <line x1="110.0" y1="150.0" x2="1540.0" y2="150.0" stroke="rgba(10,30,28,0.10)" stroke-width="1"/>
  <text x="94.0" y="157.0" text-anchor="end" font-family="'JetBrains Mono','SF Mono','Berkeley Mono',ui-monospace,'Courier New',monospace" font-size="18" fill="#4a6560">80%</text>
  <line x1="110.0" y1="770.0" x2="1540.0" y2="770.0" stroke="rgba(10,30,28,0.35)" stroke-width="2"/>
  <rect x="221.3" y="253.1" width="118.0" height="516.9" rx="3" fill="#0e8a78" stroke="#ffffff" stroke-width="2"/>
  <text x="280.3" y="237.1" text-anchor="middle" font-family="'JetBrains Mono','SF Mono','Berkeley Mono',ui-monospace,'Courier New',monospace" font-size="21" font-weight="bold" fill="#0e8a78">66.70%</text>
  <rect x="357.3" y="261.2" width="118.0" height="508.8" rx="3" fill="url(#hatch)" stroke="#ffffff" stroke-width="2"/>
  <text x="416.3" y="245.2" text-anchor="middle" font-family="'JetBrains Mono','SF Mono','Berkeley Mono',ui-monospace,'Courier New',monospace" font-size="21" font-weight="bold" fill="#b9781f">65.65%</text>
  <text x="348.3" y="810" text-anchor="middle" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', ui-serif, serif" font-size="26" fill="#0a1414">browser substeps</text>
  <text x="348.3" y="838" text-anchor="middle" font-family="'JetBrains Mono','SF Mono','Berkeley Mono',ui-monospace,'Courier New',monospace" font-size="18" fill="#4a6560">119 declared</text>
  <rect x="698.0" y="272.5" width="118.0" height="497.5" rx="3" fill="#0e8a78" stroke="#ffffff" stroke-width="2"/>
  <text x="757.0" y="256.5" text-anchor="middle" font-family="'JetBrains Mono','SF Mono','Berkeley Mono',ui-monospace,'Courier New',monospace" font-size="21" font-weight="bold" fill="#0e8a78">64.19%</text>
  <rect x="834.0" y="370.6" width="118.0" height="399.4" rx="3" fill="url(#hatch)" stroke="#ffffff" stroke-width="2"/>
  <text x="893.0" y="354.6" text-anchor="middle" font-family="'JetBrains Mono','SF Mono','Berkeley Mono',ui-monospace,'Courier New',monospace" font-size="21" font-weight="bold" fill="#b9781f">51.53%</text>
  <text x="825.0" y="810" text-anchor="middle" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', ui-serif, serif" font-size="26" fill="#0a1414">pytest substeps</text>
  <text x="825.0" y="838" text-anchor="middle" font-family="'JetBrains Mono','SF Mono','Berkeley Mono',ui-monospace,'Courier New',monospace" font-size="18" fill="#4a6560">155 declared</text>
  <rect x="1174.7" y="581.8" width="118.0" height="188.2" rx="3" fill="#0e8a78" stroke="#ffffff" stroke-width="2"/>
  <text x="1233.7" y="565.8" text-anchor="middle" font-family="'JetBrains Mono','SF Mono','Berkeley Mono',ui-monospace,'Courier New',monospace" font-size="21" font-weight="bold" fill="#0e8a78">24.28%</text>
  <rect x="1310.7" y="628.4" width="118.0" height="141.6" rx="3" fill="url(#hatch)" stroke="#ffffff" stroke-width="2"/>
  <text x="1369.7" y="612.4" text-anchor="middle" font-family="'JetBrains Mono','SF Mono','Berkeley Mono',ui-monospace,'Courier New',monospace" font-size="21" font-weight="bold" fill="#b9781f">18.27%</text>
  <text x="1301.7" y="810" text-anchor="middle" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', ui-serif, serif" font-size="26" fill="#0a1414">workflows</text>
  <text x="1301.7" y="838" text-anchor="middle" font-family="'JetBrains Mono','SF Mono','Berkeley Mono',ui-monospace,'Courier New',monospace" font-size="18" fill="#4a6560">52 declared</text>
  <text x="110" y="876" font-family="'JetBrains Mono','SF Mono','Berkeley Mono',ui-monospace,'Courier New',monospace" font-size="16" fill="#4a6560">the workflow column is the composed result; the two to its left are its parts</text>
</svg>
