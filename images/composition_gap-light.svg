  <text x="1303.3" y="789" text-anchor="middle" font-family="'DM Sans','Inter','Segoe UI',Roboto,ui-sans-serif,system-ui,sans-serif" font-size="26" fill="#0b0f1a">workflows</text>
  <text x="1303.3" y="819" text-anchor="middle" font-family="'JetBrains Mono','SF Mono','Berkeley Mono',ui-monospace,'Courier New',monospace" font-size="17" fill="#4d5878">116/416 · 83/416</text>
