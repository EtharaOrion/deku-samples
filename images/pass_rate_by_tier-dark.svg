<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Partial-credit pass rate by tier. mean combined_score over 8 runs per model, tiers cut on opus-5">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#071313"/>
      <stop offset="60%" stop-color="#0a1e1c"/>
      <stop offset="100%" stop-color="#050c0c"/>
    </linearGradient>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#e2ac52"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="rgba(5,12,12,0.55)" stroke-width="3"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>

  <text x="110" y="72" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', ui-serif, serif" font-size="40" font-weight="bold" fill="#eef2ea">Partial-credit pass rate by tier</text>
  <text x="110" y="108" font-family="'JetBrains Mono','SF Mono','Berkeley Mono',ui-monospace,'Courier New',monospace" font-size="19" fill="#9fc4bc">mean combined_score over 8 runs per model, tiers cut on opus-5</text>
  <line x1="1180" y1="47" x2="1226" y2="47" stroke="#35d0ba" stroke-width="4"/>
  <circle cx="1203" cy="47" r="8" fill="#35d0ba" stroke="#050c0c" stroke-width="3"/>
  <text x="1238" y="54" font-family="'JetBrains Mono','SF Mono','Berkeley Mono',ui-monospace,'Courier New',monospace" font-size="20" fill="#eef2ea">opus-5</text>
  <line x1="1338" y1="47" x2="1384" y2="47" stroke="#e2ac52" stroke-width="3.5" stroke-dasharray="9 7"/>
  <polygon points="1361,38 1370,47 1361,56 1352,47" fill="url(#hatch)" stroke="#050c0c" stroke-width="2.5"/>
  <text x="1396" y="54" font-family="'JetBrains Mono','SF Mono','Berkeley Mono',ui-monospace,'Courier New',monospace" font-size="20" fill="#eef2ea">glm-5.3</text>
  <line x1="110.0" y1="770.0" x2="1540.0" y2="770.0" stroke="rgba(190,225,218,0.12)" stroke-width="1"/>
  <text x="94.0" y="777.0" text-anchor="end" font-family="'JetBrains Mono','SF Mono','Berkeley Mono',ui-monospace,'Courier New',monospace" font-size="18" fill="#9fc4bc">0%</text>
  <line x1="110.0" y1="615.0" x2="1540.0" y2="615.0" stroke="rgba(190,225,218,0.12)" stroke-width="1"/>
  <text x="94.0" y="622.0" text-anchor="end" font-family="'JetBrains Mono','SF Mono','Berkeley Mono',ui-monospace,'Courier New',monospace" font-size="18" fill="#9fc4bc">15%</text>
  <line x1="110.0" y1="460.0" x2="1540.0" y2="460.0" stroke="rgba(190,225,218,0.12)" stroke-width="1"/>
  <text x="94.0" y="467.0" text-anchor="end" font-family="'JetBrains Mono','SF Mono','Berkeley Mono',ui-monospace,'Courier New',monospace" font-size="18" fill="#9fc4bc">30%</text>
  <line x1="110.0" y1="305.0" x2="1540.0" y2="305.0" stroke="rgba(190,225,218,0.12)" stroke-width="1"/>
  <text x="94.0" y="312.0" text-anchor="end" font-family="'JetBrains Mono','SF Mono','Berkeley Mono',ui-monospace,'Courier New',monospace" font-size="18" fill="#9fc4bc">45%</text>
  <line x1="110.0" y1="150.0" x2="1540.0" y2="150.0" stroke="rgba(190,225,218,0.12)" stroke-width="1"/>
  <text x="94.0" y="157.0" text-anchor="end" font-family="'JetBrains Mono','SF Mono','Berkeley Mono',ui-monospace,'Courier New',monospace" font-size="18" fill="#9fc4bc">60%</text>
  <line x1="110.0" y1="770.0" x2="1540.0" y2="770.0" stroke="rgba(190,225,218,0.38)" stroke-width="2"/>
  <line x1="467.5" y1="150.0" x2="467.5" y2="770.0" stroke="rgba(190,225,218,0.12)" stroke-width="1" stroke-dasharray="4 8"/>
  <line x1="1182.5" y1="150.0" x2="1182.5" y2="770.0" stroke="rgba(190,225,218,0.12)" stroke-width="1" stroke-dasharray="4 8"/>
  <polyline points="467.5,315.2 1182.5,514.9" fill="none" stroke="#35d0ba" stroke-width="4"/>
  <polyline points="467.5,387.2 1182.5,617.4" fill="none" stroke="#e2ac52" stroke-width="3.5" stroke-dasharray="9 7"/>
  <circle cx="467.5" cy="315.2" r="8" fill="#35d0ba" stroke="#050c0c" stroke-width="3"/>
  <circle cx="1182.5" cy="514.9" r="8" fill="#35d0ba" stroke="#050c0c" stroke-width="3"/>
  <polygon points="467.5,378.2 476.5,387.2 467.5,396.2 458.5,387.2" fill="#0a1e1c" stroke="#e2ac52" stroke-width="3"/>
  <polygon points="1182.5,608.4 1191.5,617.4 1182.5,626.4 1173.5,617.4" fill="#0a1e1c" stroke="#e2ac52" stroke-width="3"/>
  <text x="467.5" y="810" text-anchor="middle" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', ui-serif, serif" font-size="26" fill="#eef2ea">medium</text>
  <text x="467.5" y="838" text-anchor="middle" font-family="'JetBrains Mono','SF Mono','Berkeley Mono',ui-monospace,'Courier New',monospace" font-size="18" fill="#9fc4bc">n=2</text>
  <text x="1182.5" y="810" text-anchor="middle" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', ui-serif, serif" font-size="26" fill="#eef2ea">expert</text>
  <text x="1182.5" y="838" text-anchor="middle" font-family="'JetBrains Mono','SF Mono','Berkeley Mono',ui-monospace,'Courier New',monospace" font-size="18" fill="#9fc4bc">n=1</text>
  <text x="110" y="876" font-family="'JetBrains Mono','SF Mono','Berkeley Mono',ui-monospace,'Courier New',monospace" font-size="16" fill="#9fc4bc">two tiers are occupied; the line is a visual guide across bands, not a continuous trend</text>
</svg>
