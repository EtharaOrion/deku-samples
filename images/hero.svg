<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d">
<title id="t">DEKU</title>
<desc id="d">A green hooded figure stands at the left of a dark workshop holding a written specification. To the right, eight trajectory threads rise from a sealed container and only two survive to a bright verdict. Suspended glass panes show workflows mid step. Three attendant artifacts mark the work orders: a ledger for memory, an anvil for authoring, and a lens for audit.</desc>

<defs>
  <radialGradient id="sky" cx="34%" cy="30%" r="86%">
    <stop offset="0%" stop-color="#16463c"/>
    <stop offset="42%" stop-color="#0c252c"/>
    <stop offset="100%" stop-color="#040a10"/>
  </radialGradient>
  <linearGradient id="shaft" x1="0" y1="0" x2="0.6" y2="1">
    <stop offset="0%" stop-color="#9df3c6" stop-opacity="0.16"/>
    <stop offset="100%" stop-color="#9df3c6" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
