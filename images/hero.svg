    <stop offset="55%" stop-color="#22613f"/>
    <stop offset="100%" stop-color="#0d2b1b"/>
  </linearGradient>
  <linearGradient id="skin" x1="0.1" y1="0" x2="0.9" y2="1">
    <stop offset="0%" stop-color="#ffe0c2"/>
    <stop offset="60%" stop-color="#f2c6a2"/>
    <stop offset="100%" stop-color="#c99873"/>
  </linearGradient>
  <linearGradient id="live" x1="0" y1="1" x2="0" y2="0">
    <stop offset="0%" stop-color="#f6c453" stop-opacity="0.1"/>
    <stop offset="45%" stop-color="#f9d179" stop-opacity="0.95"/>
    <stop offset="100%" stop-color="#fff6d8"/>
  </linearGradient>
  <linearGradient id="dead" x1="0" y1="1" x2="0" y2="0">
    <stop offset="0%" stop-color="#7fb3a6" stop-opacity="0.95"/>
    <stop offset="58%" stop-color="#5c8c81" stop-opacity="0.62"/>
    <stop offset="100%" stop-color="#41665d" stop-opacity="0.28"/>
  </linearGradient>
  <radialGradient id="halo" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#a9ffd6" stop-opacity="0.30"/>
    <stop offset="70%" stop-color="#a9ffd6" stop-opacity="0.06"/>
    <stop offset="100%" stop-color="#a9ffd6" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="verdict" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#fff6d8" stop-opacity="0.62"/>
    <stop offset="55%" stop-color="#f6c453" stop-opacity="0.16"/>
    <stop offset="100%" stop-color="#f6c453" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="vig" cx="46%" cy="44%" r="74%">
    <stop offset="58%" stop-color="#000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000" stop-opacity="0.78"/>
  </radialGradient>
  <filter id="far" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="9"/></filter>
  <filter id="mid" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.4"/></filter>
  <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="14"/></filter>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" result="n"/>
    <feColorMatrix in="n" type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope="0.045"/></feComponentTransfer>
  </filter>
</defs>

