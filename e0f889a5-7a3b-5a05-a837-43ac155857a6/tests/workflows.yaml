- id: visitor_reads_the_letter_and_reaches_the_shop
  purpose: The front page is one long letter over a film, and the only way out of it is the footer
  substeps:
    - kind: browser
      do: Open / and read the title the table, the dateline June 1, 2026, sixteen paragraphs and the closing line See you soon.
      cov: C-OV-01, C-UF-01, C-UF-27, C-UF-28, C-UF-29, C-UF-30, C-FE-01, C-RL-01
    - kind: browser
      do: Scroll to the foot of the letter and confirm the film has been replaced by flat ground behind the writing, then scroll back up and confirm the film returns in proportion
      cov: C-UX-09, C-FE-08, C-FE-09, C-FE-11, C-FE-12
    - kind: browser
      do: Set a reduced motion preference and reload, confirming the film stays on its still frame, that the darkening still runs, and that dragging on the film scrolls the page
      cov: C-UX-11, C-UX-12, C-FE-13, C-FE-16, C-FE-21, C-FE-22, C-FE-23, C-FE-24, C-FE-25, C-UX-31, C-UX-32
    - kind: browser
      do: Move the pointer across the footer canvas and confirm the company name reads as the gaps between the dots, that a bright wake follows the pointer and fades, and that the bottom row carries the rights reserved string
      cov: C-FE-26, C-FE-27, C-FE-28, C-FE-29, C-FE-30, C-FE-31
    - kind: browser
      do: Resize from a wide viewport to a narrow one across the whole letter and confirm the column becomes half width alternating blocks with no sideways scrolling at any width
      cov: C-FE-18, C-FE-19, C-FE-20, C-UX-24
    - kind: browser
      do: Press tab from the top of the letter and confirm the skip link is the first focusable element, that every focused element shows a ring, and that the type is one family with no italic
      cov: C-UX-04, C-UX-06, C-UX-18, C-UX-20, C-UX-21, C-UX-25, C-UX-26, C-UX-27, C-UX-28, C-UX-29, C-UX-30, C-FE-104
    - kind: browser
      do: Follow the Shop link in the footer row to /shop and read the five seeded products in editorial order beside the empty state copy the catalogue falls back to
      cov: C-UF-31, C-FE-32, C-FE-39, C-UF-02, C-UF-39, C-OV-02, C-RL-02
    - kind: pytest
      test: test_storefront.py::test_health_route_and_reserved_directories_exist
      critical: true
      cov: C-DC-01, C-DC-02, C-DC-03, C-DC-04, C-DC-05, C-DC-07, C-DC-08, C-DC-09, C-DC-10, C-DC-11, C-DC-12, C-DC-13, C-DC-14, C-DC-15, C-DC-18, C-DC-29, C-DC-31, C-TR-01, C-TR-02, C-TR-14, C-TR-15, C-TR-16, C-TR-17, C-TR-31, C-TR-32, C-TR-33, C-TR-34, C-TR-35, C-TR-36, C-TR-37, C-TR-38, C-CN-10
    - kind: pytest
      test: test_storefront.py::test_seeded_catalogue_rows_exist_as_specified
      critical: true
      cov: C-DM-33, C-DM-34, C-DM-35, C-DM-36, C-DM-37, C-DM-38, C-DM-39, C-DM-40, C-DM-41, C-DM-42, C-DM-43, C-DM-05, C-DM-07, C-DM-09, C-DM-10, C-DM-29, C-CN-01, C-CN-08, C-TR-09, C-TR-10

- id: guest_buys_a_camera_and_an_accessory_at_checkout
  purpose: A guest reaches a confirmed order at the exact total the final step displayed
  substeps:
    - kind: browser
      do: Read the left rail beside the catalogue carrying the shop, downloads and installer entries, with the current entry marked and the cart control named with its item count
      cov: C-FE-33, C-FE-34, C-FE-35, C-FE-36, C-FE-37, C-FE-38
    - kind: browser
      do: Open /shop/compact, choose Graphite and add one to the cart, then open /shop/case and add one Travel Case
      cov: C-UF-03, C-FE-43, C-DC-19, C-OV-03, C-RL-03, C-DM-13
    - kind: browser
      do: Open /cart and read a subtotal of $378.00 with the shipment protection toggle unticked, then empty the cart and read the empty state
      cov: C-UF-32, C-UF-04, C-DM-45, C-FE-54, C-DM-44, C-UF-40
    - kind: browser
      do: Walk the three checkout routes entering customer@example.com and a US address, choose Standard, then read a tax line of $37.80 and a total of $415.80
      cov: C-UF-05, C-UF-06, C-UF-07, C-UF-33, C-DM-46, C-DM-48, C-FE-57, C-OV-04, C-RL-04, C-RL-23, C-DC-20, C-DM-47, C-FE-60, C-FE-61
    - kind: browser
      do: Place the order and land on /orders/VE-2026-0002 reading the confirmation naming the order number and the address
      cov: C-UF-08, C-UF-34, C-UF-35, C-UF-36, C-FE-62, C-FE-63, C-RL-05
    - kind: pytest
      test: test_storefront.py::test_guest_checkout_creates_order_with_pinned_totals
      critical: true
      cov: C-CF-12, C-CF-15, C-DM-14, C-TR-20, C-TR-21, C-DC-21, C-DM-11, C-DM-12, C-DM-15, C-DM-16, C-TR-22, C-TR-23, C-CN-02
    - kind: pytest
      test: test_storefront.py::test_order_totals_reconcile_with_stored_lines
      critical: true
      cov: C-TR-24, C-DM-17, C-DM-18, C-TR-18, C-TR-19, C-DM-19, C-TR-08

