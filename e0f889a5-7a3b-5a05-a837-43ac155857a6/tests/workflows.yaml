      critical: true
      cov: C-CF-27, C-CF-28, C-CF-29, C-TR-30, C-DC-28

- id: concurrent_checkout_for_the_last_unit_allows_exactly_one
  purpose: The last camera in stock is sold once, decided by the store rather than by a handler guard
