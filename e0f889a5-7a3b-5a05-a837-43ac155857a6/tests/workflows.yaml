- id: customer_registers_an_unowned_camera
  purpose: A serial with no live owner joins the signed-in customer's camera grid
  substeps:
    - kind: browser
      do: Create an account at /sign-up, sign out back to the letter, then sign in as customer@example.com at /sign-in with the seeded password and land on /account; submit a wrong password and read That did not work., then open an address no route serves and read That page does not exist.
      cov: C-UF-12, C-UF-13, C-UF-21, C-UF-22, C-RL-20, C-RL-21, C-RL-22, C-DM-01, C-DM-02, C-CF-01, C-CF-02, C-CF-05, C-TR-11, C-TR-13, C-DC-06, C-DC-16, C-DC-17, C-FE-105, C-FE-106
    - kind: browser
      do: Open /account/cameras, read the empty camera state on an account with none, then type VA2609KTMHX4 into the register row, submit, and read the new card showing Not yet connected
      cov: C-UF-16, C-UF-37, C-UF-38, C-UF-41, C-FE-96, C-FE-97, C-FE-99, C-DC-23
    - kind: browser
      do: Open the camera page for the registered serial, rename it, then read the release control and its confirmation step before releasing ownership
      cov: C-UF-17, C-RL-13, C-RL-14, C-FE-101, C-FE-107, C-FE-108, C-FE-109
    - kind: pytest
      test: test_storefront.py::test_device_registration_claims_unowned_serial_and_writes_one_ownership_row
      critical: true
      cov: C-CF-30, C-CF-36, C-RL-12, C-CF-38, C-DM-30

- id: registering_a_camera_owned_by_another_account_is_denied
